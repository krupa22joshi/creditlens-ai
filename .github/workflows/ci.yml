name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests scripts app
      - run: pytest
      - name: Train and evaluate guardrails
        run: |
          python scripts/train.py --rows 8000 --folds 3
          python scripts/evaluate.py --n 40 --provider mock
          python scripts/evaluate_retrieval.py
